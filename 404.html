<style>
  :root{ --maroon:#6B0F0F; --ink:#4A423A; --cream:#F7F1E6; }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;
       padding:24px;text-align:center}
  h1{font-family:"Playfair Display",Georgia,serif;color:var(--maroon);font-size:28px;
     letter-spacing:.06em;margin:0 0 10px}

<body>
<div>
  <h1>VISHRAM SPICES</h1>
  <p>That page could not be found.</p>
  <p><a href="https://vishramspices.com/">Go to the catalogue</a></p>
</div>
<script>
  /* The goni QR spells the address in CAPITALS. GitHub Pages treats /ORDER and
     /order as different addresses, so anything that looks like an order link —
     whatever the spelling — gets sent to the real page here. */
  var p = location.pathname.toLowerCase().replace(/\/+$/, "");
  if (p === "/order" || p === "/order.html" || p === "/order/index.html") {
    location.replace("/ORDER/");
  }
</script>
</body>
